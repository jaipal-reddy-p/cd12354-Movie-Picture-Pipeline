name: Frontend Continuous Integration
on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - 'frontend/**'
  workflow_dispatch:
jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: cd starter/frontend 2>/dev/null || cd frontend; npm ci || npm install
      - run: cd starter/frontend 2>/dev/null || cd frontend; npm run lint
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: cd starter/frontend 2>/dev/null || cd frontend; npm ci || npm install
      - run: cd starter/frontend 2>/dev/null || cd frontend; CI=true npm test
  build:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: cd starter/frontend 2>/dev/null || cd frontend; npm ci || npm install
      - run: cd starter/frontend 2>/dev/null || cd frontend; CI=true npm test
      - env:
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}
        run: |
          cd starter/frontend 2>/dev/null || cd frontend
          docker build --build-arg REACT_APP_MOVIE_API_URL=${REACT_APP_MOVIE_API_URL} --tag mp-frontend:latest .
